name: CI

# Every pull request (main requires "check"). Not again on the push to main after merging: the
# pull request already ran on the same code (11-04: Actions minutes). Not while a pull request
# is a draft: work in progress is checked on the developer's own machine, and marking it ready runs
# this once. Run it by hand from the Actions tab when wanted. The drive tests are in storage.yml,
# run only when the code they test changes.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
