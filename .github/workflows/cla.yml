# Contributor License Agreement (CLA.md): every outside pull request waits until its author has
# signed, by posting the sentence below as a comment on the pull request. Signatures are kept in
# the cla-signatures branch of this repository. Pinned to an exact release commit (v2.6.1).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/DragonsOath/hearth/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],claude[bot]
          custom-notsigned-prcomment: >-
            Thanks for the pull request! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/DragonsOath/hearth/blob/main/CLA.md)
            and sign it by posting this comment:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Everyone on this pull request has signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
