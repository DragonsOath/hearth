# Deploys Ember Bot (services/ember-bot) to Cloudflare Workers when it changes on main, or by hand.
# The tokens come from this repository's secrets and are never printed.
name: ember-bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["services/ember-bot/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Are the tokens set?
        id: ready
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          # A new copy of the repository has no tokens yet: skip instead of failing.
          if [ "$HAS_TOKEN" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::CLOUDFLARE_API_TOKEN is not set, so Ember Bot was not deployed."; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: steps.ready.outputs.go == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/ember-bot
          secrets: |
            BOT_TOKEN
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
