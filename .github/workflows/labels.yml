name: Labels

# The repository's labels, kept as .github/labels.json says (How requests work: every request ends
# with one of Planned, PR welcome, Ember can do this or Not planned; Duplicate closes a repeat).
# Runs only when that file changes on main, or by hand. Labels are made or updated, never deleted.
on:
  push:
    branches: [main]
    paths: [.github/labels.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/labels.json
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const want = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.github/labels.json`, "utf8"));
            const have = await github.paginate(github.rest.issues.listLabelsForRepo, { ...context.repo, per_page: 100 });
            for (const l of want) {
              // Label names ignore case on GitHub: "duplicate" is updated to "Duplicate", not made twice.
              const old = have.find((h) => h.name.toLowerCase() === l.name.toLowerCase());
              if (old) {
                await github.rest.issues.updateLabel({ ...context.repo, name: old.name, new_name: l.name, color: l.color, description: l.description });
                core.info(`Updated ${l.name}`);
              } else {
                await github.rest.issues.createLabel({ ...context.repo, name: l.name, color: l.color, description: l.description });
                core.info(`Made ${l.name}`);
              }
            }
